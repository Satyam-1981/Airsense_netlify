services:
  - type: web
    name: airsense-api
    runtime: python
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_RESOURCE_ID
        sync: false
