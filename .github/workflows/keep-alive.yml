
name: Keep atmoiq Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl --fail --silent --show-error \
            https://atmoiq-api-om9k.onrender.com/health
